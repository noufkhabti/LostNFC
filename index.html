<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <title>استعلام ولي الأمر</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8cdda, #f6e7c1, #c8e7ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      width: 90%;
      max-width: 560px;
      background: white;
      border-radius: 30px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #333;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin: 12px 0 25px;
      font-size: 15px;
      line-height: 1.8;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 18px;
      border: 2px solid #eee;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .searchBtn {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 18px;
      font-size: 18px;
      color: white;
      background: linear-gradient(135deg, #7b61ff, #ff7eb3);
      cursor: pointer;
      font-weight: bold;
    }

    .result {
      margin-top: 25px;
      text-align: right;
    }

    .item {
      background: #f4f3ff;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 16px;
      line-height: 1.9;
      border-right: 6px solid #7b61ff;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="icon">🎒</div>

  <h1>استعلام ولي الأمر</h1>

  <div class="subtitle">
    أدخل رقم هوية الطالبة لعرض المقتنيات
  </div>

  <input id="nationalId" type="text" placeholder="رقم الهوية">

  <button class="searchBtn" onclick="searchItems()">
    استعلام
  </button>

  <div id="result" class="result"></div>

</div>

<script>

function searchItems() {

  const id =
    document.getElementById("nationalId")
    .value.trim();

  const result =
    document.getElementById("result");

  result.innerHTML = "جاري البحث...";

  google.script.run

    .withSuccessHandler(function(data) {

      if (!data || data.length === 0) {

        result.innerHTML =
          "لا توجد بيانات";

        return;
      }

      let html = "";

      data.forEach(function(item) {

        html += `

          <div class="item">

            <strong>اسم الطالبة:</strong>
            ${item.name}<br>

            <strong>الصف:</strong>
            ${item.grade}<br>

            <strong>المقتنى:</strong>
            ${item.item}<br>

            <strong>الحالة:</strong>
            ${item.status}<br>

            <strong>اللون:</strong>
            ${item.color}<br>

            <strong>الوصف:</strong>
            ${item.description}

          </div>

        `;
      });

      result.innerHTML = html;
    })

    .getItemsById(id);
}

</script>

</body>
</html>
